profile(){const c=cur();return`<h1>My PC profile</h1><div class="grid g2"><div class="card"><h2>${esc(c.name)}</h2><p class="sm mut">${esc(c.cpu)} · ${esc(c.gpu)} · ${c.ram} GB ${c.ramType} · ${c.storage}</p><label>Upgrade notes</label><textarea rows="5" oninput="A.notes(this.value)" placeholder="Planned upgrades, motherboard model, PSU wattage…">${esc(S.notes)}</textarea></div>
 <div class="card"><h2>Favorite games</h2>${S.fav.length?S.fav.map(f=>`<span class="tag g">${esc(f)}</span> `).join(""):'<div class="empty">Add favorites from the FPS estimator.</div>'}<h2 style="margin-top:14px">Upgrade wishlist</h2>${S.wish.length?S.wish.map(f=>`<span class="tag">${esc(f)}</span> `).join(""):'<div class="empty">Nothing yet. Add items in Upgrade advisor.</div>'}</div>
 <div class="card"><h2>Saved analyses</h2>${S.saved.length?S.saved.map((s,i)=>`<div class="row" style="justify-content:space-between"><span class="sm">${esc(s.name)}: ${s.score}/100, ${Math.round(s.avg)} avg FPS<br><span class="mut">${s.date}</span></span><button class="btn d" onclick="A.delAn(${i})">Delete</button></div>`).join(""):'<div class="empty">Run an analysis and save it.</div>'}</div></div>`},
glossary(){return`<h1>Glossary</h1><div class="grid">${GLOSS.map(g=>`<div class="card"><h3>${g[0]}</h3><p class="sm mut">${g[1]}</p></div>`).join("")}</div>`},
settings(){const s=S.set;return`<h1>Settings</h1><div class="card" style="max-width:480px"><label>Theme</label><select onchange="A.s('theme',this.value)">${opts(["dark","light"],s.theme)}</select><label>Accent</label><select onchange="A.s('ac',this.value)">${opts(["green","blue","red"],s.ac)}</select><label>Performance units</label><select onchange="A.s('ms',this.value=='ms')"><option value="fps" ${s.ms?"":"selected"}>FPS</option><option value="ms" ${s.ms?"selected":""}>Frame time (ms)</option></select><label>Click sounds</label><select onchange="A.s('snd',this.value=='on')"><option value="on" ${s.snd===false?"":"selected"}>On</option><option value="off" ${s.snd===false?"selected":""}>Off</option></select><div style="margin-top:16px"><button class="btn d" onclick="A.reset()">Reset all saved data</button></div></div>`}};
const NAV=[["dash","Home"],["build","My PC"],["games","Games"],["upgrade","Upgrades"],["budget","Budget Build"],["guide","Guide"],["more","More"]];
// ---------- ACTIONS ----------
const A={
ack(){ack=true;render()},bset(k,v){bud[k]=v;if(k=='sty')bud.st=1000;render()},saveBB(){const r=bb(bud.b,bud.res);if(!r)return;S.cfgs.push({...r.cfg,id:uid(),name:'Budget build $'+bud.b});save();alert('Saved. You can find it under My PC.')},
go(v){view=v;msg="";render()},
d(k,v,rr){draft[k]=v;if(rr)render()},
newcfg(){draft=null;editId=null;A.go("build")},
saveDraft(){const d=draft,e=[];if(!d.name.trim()&&d.cpu.trim()&&d.gpu.trim())d.name=d.cpu+" + "+d.gpu;if(!d.cpu.trim())e.push("Choose or enter a CPU.");if(!d.gpu.trim())e.push("Choose or enter a GPU.");
 if(!CPUS.some(x=>x.n.toLowerCase()==d.cpu.toLowerCase())&&!(d.cpuI>=1&&d.cpuI<=500))e.push("Custom CPU needs an index from 1 to 500.");if(!GPUS.some(x=>x.n.toLowerCase()==d.gpu.toLowerCase())&&!(d.gpuI>=1&&d.gpuI<=500))e.push("Custom GPU needs an index from 1 to 500.");
 if(e.length){msg=e.join(" ");return render()}
 if(editId){S.cfgs=S.cfgs.map(c=>c.id==editId?{...d,id:editId}:c)}else{d.id=uid();S.cfgs.push(d);S.active=d.id}
 draft=null;editId=null;save();render()},
edit(id){draft={...S.cfgs.find(c=>c.id==id)};editId=id;render();scrollTo(0,0)},cancelEdit(){draft=null;editId=null;render()},
dup(id){const c=S.cfgs.find(x=>x.id==id);S.cfgs.push({...c,id:uid(),name:c.name+" (copy)"});save();render()},
del(id){if(S.cfgs.length<2){alert("Keep at least one configuration.");return}if(!confirm("Delete this configuration?"))return;S.cfgs=S.cfgs.filter(c=>c.id!=id);if(S.active==id)S.active=S.cfgs[0].id;save();render()},
setDef(id){S.active=id;save();render()},cmpWith(id){cmp.a=S.active;cmp.b=id==S.active?(S.cfgs.find(c=>c.id!=id)||{}).id:id;A.go("compare")},
cset(k,v){cmp[k]=v;render()},gsel(v){if(view=="compare")cmp.g=+v;else{gs.g=+v;gs.up=false;const n=GAMES[gs.g].n;S.recent=[n,...S.recent.filter(x=>x!=n)].slice(0,6);save()}render()},
gtype(v){const i=GAMES.findIndex(g=>g.n.toLowerCase()==v.toLowerCase());if(i>=0)A.gsel(i)},gset(k,v){gs[k]=v;render()},openGame(n){gs.g=GAMES.findIndex(g=>g.n==n);A.go("games")},
fav(n){S.fav=S.fav.includes(n)?S.fav.filter(x=>x!=n):[...S.fav,n];save();render()},
u(k,v){up[k]=v;render()},wish(n){if(!S.wish.includes(n))S.wish.push(n);save();render()},unwish(n){S.wish=S.wish.filter(x=>x!=n);save();render()},
notes(v){S.notes=v;save()},s(k,v){S.set[k]=v;save();theme();render()},
run(){S.run="busy";view="analysis";render();const st=["Reading hardware indexes…","Modelling 14 games at "+cur().res+"…","Weighing RAM, VRAM and storage…","Scoring balance…"];let i=0;const t=setInterval(()=>{const e=$("#step");if(e)e.textContent=st[Math.min(++i,3)]},400);setTimeout(()=>{clearInterval(t);S.run="done";render()},1700)},
saveAn(){const c=cur(),a=analyze(c);S.saved.unshift({name:c.name,score:a.score,avg:a.avg,date:new Date().toLocaleDateString()});save();alert("Analysis saved to My PC.")},
delAn(i){S.saved.splice(i,1);save();render()},
report(){const c=cur(),a=analyze(c);const t=`RigCheck report: ${c.name}\n${c.cpu} + ${c.gpu}, ${c.ram} GB ${c.ramType}, ${c.storage}\n${c.res} ${c.preset}${c.oc?", overclocked":""}\nBalance score: ${a.score}/100 (estimate)\nGPU-bound in ${a.gb}/14 sample games\n\n${a.r.map((x,i)=>`${GAMES[i].n}: ${x.na?'not supported on this OS':'~'+Math.round(x.avg)+' FPS, '+x.lim+'-bound'}`).join("\n")}\n\nNote: values are model estimates from rough sample data, not verified benchmarks.`;
 $("#rep").innerHTML=`<pre id="rt">${esc(t)}</pre>`;try{navigator.clipboard.writeText(t).then(()=>alert("Report copied to clipboard."),()=>{})}catch(e){}},
reset(){if(confirm("Delete all saved configurations and data?")){try{localStorage.removeItem("rigcheck")}catch(e){}location.reload()}}};
function theme(){document.documentElement.dataset.theme=S.set.theme;document.documentElement.dataset.ac=S.set.ac}
function render(){theme();$("#nav").innerHTML=NAV.map(n=>`<button class="${(n[0]==view||(n[0]=="more"&&["compare","profile","glossary","settings"].includes(view))||(n[0]=="dash"&&view=="analysis"))?"on":""}" onclick="A.go('${n[0]}')">${n[1]}</button>`).join("");
 if(first){$("#app").innerHTML='<div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';first=false;setTimeout(render,300);return}
 $("#app").innerHTML=V[view]();const k=view+(view=="analysis"?S.run:"");if(k!=window._lv){const m=$("#app");m.classList.remove("pg");void m.offsetWidth;m.classList.add("pg");window._lv=k}if(S.run=="busy"&&view!="analysis")S.run=null}
let AC;function snd(t){if(S.set.snd===false)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime,f=t=="p"?880:t=="d"?220:t=="n"?660:520;o.type="sine";o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.5,n+.06);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.08,n+.008);g.gain.exponentialRampToValueAtTime(.0001,n+.12);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+.13)}catch(e){}}
document.addEventListener("click",e=>{const t=e.target.closest("button,summary,.card[onclick],input[type=checkbox],select");if(!t)return;const c=t.classList;snd(c.contains("d")?"d":t.closest("nav")?"n":c.contains("btn")&&!c.contains("s")?"p":"s")});
if(S.run=="busy")S.run=null;
render();
</script></body></html>
